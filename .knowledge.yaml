  source_text: 'Approved memory: Use --dump-styles to verify which CSS declaration wins'
  type: explicit
  generation: 0
  origin: manual
  memory_file: dump-styles-confirms-cascade-wins.md
- statement: The Guardian's front page server-renders many repeated article grids (dcr-cavc6m) and More ... subsections (dcr-22655).
    In a real browser these are lazy-loaded or collapsed by JS, but in a static render they stack to ~20,000px. Hiding the
    tail via inline display:none before style resolution is necessary for a usable screenshot.
  source_text: 'Approved memory: Guardian homepage long tail of sections inflates static renders'
  type: explicit
  generation: 0
  origin: manual
  memory_file: guardian-tail-sections-bloat.md
- statement: When --dump-boxes shows dozens of section.dcr-* elements each with normal individual height, the height bloat
    is caused by too many sections rather than a single oversized element. The fix is to hide the tail, not to clamp a root
    container.
  source_text: 'Approved memory: News homepages bloat by rendering many stacked sections'
  type: explicit
  generation: 0
  origin: manual
  memory_file: section-tail-pattern.md
- statement: The Guardian's .top-banner-ad-container is server-rendered with a min-height of ~294px because no ad loads in
    a static render. Firefox collapses this slot via its ad/JS path, so the masthead sits at the top. In Incognidium the placeholder
    pushes all content down by ~300px; hide it entirely for a usable screenshot.
  source_text: 'Approved memory: Guardian top ad placeholder pushes masthead down in static render'
  type: explicit
  generation: 0
  origin: manual
  memory_file: guardian-top-ad-placeholder.md
- statement: The Guardian's top highlights carousel is server-rendered but relies on CSS grid placement that our engine resolves
    below the masthead instead of above it. Keeping it visible pushes the article stream down and out of alignment with Firefox.
    Hiding it gives a compact, readable static render.
  source_text: 'Approved memory: Guardian highlights carousel mis-positioned below masthead in static render'
  type: explicit
  generation: 0
  origin: manual
  memory_file: guardian-highlights-carousel-position.md
- statement: When comparing a tall Incognidium render with a Firefox screenshot, cropping both to the first 2000px and placing
    them side-by-side makes it obvious whether the masthead, carousel, or first article grid are vertically aligned.
  source_text: 'Approved memory: Side-by-side first 2000px catches top-offset discrepancies'
  type: explicit
  generation: 0
  origin: manual
  memory_file: side-by-side-first-2000px.md
- statement: The BBC homepage server-renders its mobile hamburger drawer and backdrop with CSS like translateX(-100%). In
    Incognidium the transform is not applied, so the drawer renders as a 320x10000+ block at x=-320 and the backdrop creates
    a dark overlay across the page. Hiding the NavigationPanel, Drawer, Backdrop, and SkipLink styled-components removes the
    pollution.
  source_text: 'Approved memory: BBC mobile navigation drawer server-rendered and off-screen pollutes static render'
  type: explicit
  generation: 0
  origin: manual
  memory_file: bbc-nojs-navigation-drawer.md
