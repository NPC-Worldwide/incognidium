    multi-column grids. Incognidium often does not evaluate these media queries at
    1280px, causing the no-JS render to collapse into a tall single-column mobile
    layout while Firefox no-JS shows the desktop grid. Restoring the full desktop
    grid usually requires reconstructing complex CSS-variable-based grid tracks and
    is high-effort; look for smaller usability wins (missing search, hidden navigation,
    empty skeletons) before attempting full layout reconstruction.
