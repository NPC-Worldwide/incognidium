  type: explicit
  generation: 0
  origin: manual
  memory_file: render-tall-pages-with-sleep-hacks.md
- statement: AP News hides its mobile hamburger menu and 'More' dropdown with CSS in the no-JS render, but the site's JS sets
    inline display on the cloned menus so the CSS rule is overridden; stamping display:none inline after JS execution removes
    them from the static layout.
  source_text: 'Approved memory: AP News hidden menus require inline display:none after JS'
  type: explicit
  generation: 0
  origin: manual
  memory_file: ap-news-inline-menu-suppression.md
- statement: Absolutely positioned hidden menus may not increase overall page height, but they still appear in the flat-box
    dump and DOM fallback text, creating duplicate/overlaid text that does not match a real browser; suppress them for clean
    renders.
  source_text: 'Approved memory: Off-canvas hidden menus still pollute flat-box and text output'
  type: explicit
  generation: 0
  origin: manual
  memory_file: absolute-hidden-menus-pollute-render.md
