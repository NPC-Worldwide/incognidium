name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform failing must not cancel the other platform builds.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x64
          - platform: macos
            os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.target }}

      # Linux deps for winit/softbuffer
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libxi-dev libxtst-dev
          cargo install cargo-deb --force

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p incognidium-shell

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      # ── Linux: .deb package ──
      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo deb -p incognidium-shell --target ${{ matrix.target }} --no-build
          mkdir -p upload
          cp target/${{ matrix.target }}/debian/*.deb upload/incognidium_${{ steps.version.outputs.version }}_amd64.deb
          # Also copy raw binary
          cp target/${{ matrix.target }}/release/incognidium upload/incognidium_${{ steps.version.outputs.version }}_linux-x64
          cp target/${{ matrix.target }}/release/render_to_png upload/incognidium-render_${{ steps.version.outputs.version }}_linux-x64

      # ── macOS: sign, package, notarize ──
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS'
        id: signing
        env:
          CERT_B64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          CERT_PW: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_SPECIFIC: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ASC_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY }}
        run: |
          set -uo pipefail

          # Ad-hoc signing only if no certificate secret is configured at all.
          if [ -z "${CERT_B64:-}" ] || [ -z "${CERT_PW:-}" ]; then
            echo "::warning::APPLE_DEVELOPER_ID_APPLICATION / _CERTIFICATE_PASSWORD not set; ad-hoc signing."
            echo "have_cert=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_cert=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${APP_SPECIFIC:-}" ] || [ -n "${ASC_KEY:-}" ]; then
            echo "have_notary=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notary=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No notarization credentials; DMG will be signed but not notarized."
          fi

          if [ -n "${CERT_B64:-}" ] && [ -n "${CERT_PW:-}" ]; then
            printf '%s' "$CERT_B64" | base64 --decode > build_cert.p12

            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"

            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            # No -t cert: that flag imports certificates only and drops the
            # private keys, leaving no identity that can actually sign.
            security import build_cert.p12 -P "$CERT_PW" -A -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" \
              $(security list-keychains -d user | sed 's/ *//' | tr '\n' ' ' | tr -d '"')

            IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)

            if [ -z "$IDENTITY" ]; then
              echo "::error::The APPLE_DEVELOPER_ID_APPLICATION secret has no usable"
              echo "::error::'Developer ID Application' identity (certificate + private key pair)."
              echo "Identities found in the imported p12:"
              security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
              echo "Export a p12 that includes the PRIVATE KEY (Keychain Access ->"
              echo "My Certificates -> Developer ID Application -> Export), base64 it,"
              echo "and update the secret."
              exit 1
            fi

            echo "Found signing identity: $IDENTITY"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            echo "SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
            rm -f build_cert.p12
          fi

      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        env:
          HAVE_CERT: ${{ steps.signing.outputs.have_cert }}
        run: |
          set -euo pipefail
          mkdir -p upload
          APP=Incognidium.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/incognidium" "$APP/Contents/MacOS/"
          mkdir -p "$APP/Contents/Resources"
          ICONSET="Incognidium.iconset"
          rm -rf "$ICONSET"
          mkdir "$ICONSET"
          sips -z 16 16     assets/logo.png --out "$ICONSET/icon_16x16.png"       >/dev/null
          sips -z 32 32     assets/logo.png --out "$ICONSET/icon_16x16@2x.png"    >/dev/null
          sips -z 32 32     assets/logo.png --out "$ICONSET/icon_32x32.png"       >/dev/null
          sips -z 64 64     assets/logo.png --out "$ICONSET/icon_32x32@2x.png"    >/dev/null
          sips -z 128 128   assets/logo.png --out "$ICONSET/icon_128x128.png"    >/dev/null
          sips -z 256 256   assets/logo.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256   assets/logo.png --out "$ICONSET/icon_256x256.png"    >/dev/null
          sips -z 512 512   assets/logo.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512   assets/logo.png --out "$ICONSET/icon_512x512.png"    >/dev/null
          sips -z 1024 1024 assets/logo.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          rm -rf "$ICONSET"

          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Incognidium</string>
            <key>CFBundleDisplayName</key><string>Incognidium</string>
            <key>CFBundleIdentifier</key><string>com.npcww.incognidium</string>
            <key>CFBundleVersion</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ steps.version.outputs.version }}</string>
            <key>CFBundleExecutable</key><string>incognidium</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIconName</key><string>AppIcon</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          if [ "$HAVE_CERT" = "true" ]; then
            security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$SIGNING_KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN" >/dev/null

            # Sign the executable first, then the bundle. --deep is deprecated and
            # unreliable; --timestamp is required for notarization.
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$APP/Contents/MacOS/incognidium"
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$APP"
            codesign --verify --strict --verbose=2 "$APP"
            echo "Signed with: $APPLE_SIGNING_IDENTITY"
          else
            echo "No certificate available; ad-hoc signing."
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict "$APP"
          fi

          STAGING="dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -a "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          DMG_PATH="upload/incognidium_${{ steps.version.outputs.version }}_macos-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Incognidium" -srcfolder "$STAGING" \\
            -ov -format UDZO "$DMG_PATH"
          rm -rf "$STAGING"

          RAW_BIN="upload/incognidium_${{ steps.version.outputs.version }}_macos-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/incognidium" "$RAW_BIN"
          chmod +x "$RAW_BIN"
          if [ "$HAVE_CERT" = "true" ]; then
            codesign --force --options runtime --timestamp \
              --sign "$APPLE_SIGNING_IDENTITY" "$RAW_BIN"
            codesign --verify --strict --verbose=2 "$RAW_BIN"
            echo "Standalone binary signed independently."
          else
            codesign --force --sign - "$RAW_BIN" || true
          fi
      - name: Notarize and staple (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.have_notary == 'true'
        env:
          HAVE_CERT: ${{ steps.signing.outputs.have_cert }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_APP_STORE_CONNECT_KEY: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY }}
          APPLE_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_KEY_ID }}
          APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$HAVE_CERT" != "true" ]; then
            echo "Skipping notarization: binary is ad-hoc signed."
            exit 0
          fi

          DMG_PATH="upload/incognidium_${{ steps.version.outputs.version }}_macos-${{ matrix.arch }}.dmg"

          # Prefer the App Store Connect API key when present; it does not expire
          # like an app-specific password.
          if [ -n "${APPLE_APP_STORE_CONNECT_KEY:-}" ] \
             && [ -n "${APPLE_APP_STORE_CONNECT_KEY_ID:-}" ] \
             && [ -n "${APPLE_APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_APP_STORE_CONNECT_KEY" > "$KEY_PATH"
            xcrun notarytool submit "$DMG_PATH" \
              --key "$KEY_PATH" \
              --key-id "$APPLE_APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APPLE_APP_STORE_CONNECT_ISSUER_ID" \
              --wait
          else
            xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          fi

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      # ── Windows: .exe ──
      - name: Package EXE (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir upload
          copy target\${{ matrix.target }}\release\incognidium.exe upload\incognidium_${{ steps.version.outputs.version }}_windows-x64.exe
          copy target\${{ matrix.target }}\release\render_to_png.exe upload\incognidium-render_${{ steps.version.outputs.version }}_windows-x64.exe
        shell: cmd

      # ── Upload to GCS ──
      - name: Authenticate to Google Cloud
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload to Google Cloud Storage
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          for file in upload/*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              gsutil cp "$file" gs://incognidium-executables/${{ matrix.platform }}-${{ matrix.arch }}/"$filename"
              echo "Uploaded $filename"
            fi
          done
        shell: bash

      - name: Upload manifest
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && matrix.platform == 'linux'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cat > /tmp/manifest.json << EOF
          {
            "version": "$VERSION",
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "downloads": {
              "linux-deb": "https://storage.googleapis.com/incognidium-executables/linux-x64/incognidium_${VERSION}_amd64.deb",
              "linux-bin": "https://storage.googleapis.com/incognidium-executables/linux-x64/incognidium-render_${VERSION}_linux-x64",
              "linux-gui": "https://storage.googleapis.com/incognidium-executables/linux-x64/incognidium_${VERSION}_linux-x64",
              "linux-render": "https://storage.googleapis.com/incognidium-executables/linux-x64/incognidium-render_${VERSION}_linux-x64",
              "macos-dmg": "https://storage.googleapis.com/incognidium-executables/macos-arm64/incognidium_${VERSION}_macos-arm64.dmg",
              "macos-bin": "https://storage.googleapis.com/incognidium-executables/macos-arm64/incognidium_${VERSION}_macos-arm64",
              "macos-render": "https://storage.googleapis.com/incognidium-executables/macos-arm64/incognidium-render_${VERSION}_macos-arm64",
              "windows-exe": "https://storage.googleapis.com/incognidium-executables/windows-x64/incognidium_${VERSION}_windows-x64.exe",
              "windows-render": "https://storage.googleapis.com/incognidium-executables/windows-x64/incognidium-render_${VERSION}_windows-x64.exe"
            }
          }
          EOF
          gsutil -h "Cache-Control:no-cache,max-age=0" cp /tmp/manifest.json \
            gs://incognidium-executables/manifest.json
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: incognidium-${{ matrix.platform }}-${{ matrix.arch }}
          path: upload/*
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Incognidium ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/incognidium-linux-x64/*
            artifacts/incognidium-macos-arm64/*
            artifacts/incognidium-windows-x64/*
