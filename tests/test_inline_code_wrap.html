<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Inline code wrap</title>
<style>
body { margin: 20px; font-family: system-ui, sans-serif; }
.container { width: 320px; border: 2px solid #ccc; padding: 10px; }
code { font-family: monospace; background: #f4f4f4; padding: 2px 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="container">
<p>Tags: <code>&lt;head&gt;</code> <code>&lt;title&gt;</code> <code>&lt;body&gt;</code> <code>&lt;header&gt;</code> <code>&lt;footer&gt;</code> <code>&lt;article&gt;</code> <code>&lt;section&gt;</code> <code>&lt;p&gt;</code> <code>&lt;div&gt;</code> <code>&lt;span&gt;</code></p>
</div>
</body>
</html>
