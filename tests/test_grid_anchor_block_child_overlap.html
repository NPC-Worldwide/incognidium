<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; max-width: 400px; }
    a { text-decoration: none; color: inherit; }
    h3 { margin: 0; font-size: 20px; }
    p { margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="grid">
    <a href="#">
      <div>
        <h3>Generic headline text used to exercise grid anchor block-child layout</h3>
        <p>Generic description text that follows the headline inside the same grid card.</p>
      </div>
    </a>
  </div>
</body>
</html>
