<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: system-ui, sans-serif;
  padding: 20px;
  max-width: 600px;
}
.float {
  float: left;
  width: 120px;
  height: 120px;
  background: #888;
  margin: 0 16px 16px 0;
}
p {
  line-height: 1.5;
  font-size: 18px;
}
</style>
</head>
<body>
<div class="float"></div>
<p>This paragraph wraps beside the gray float and should continue at the full page width once the float ends, without dropping the last word onto a lonely line.</p>
</body>
</html>
