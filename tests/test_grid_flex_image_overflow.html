<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Grid track flex container with images</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
    background: #fff;
  }
  .page {
    display: grid;
    grid-template-columns: 70% 30%;
    max-width: 1200px;
    margin: 0 auto;
    gap: 20px;
  }
  .main {
    border: 2px dashed #333;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
  }
  .card {
    box-sizing: border-box;
    width: 100%;
    flex: 1 1 0%;
    padding: 10px;
    border: 1px solid #ccc;
  }
  .media {
    display: grid;
    width: 100%;
    aspect-ratio: 3 / 2;
    overflow: hidden;
    background: #ddd;
  }
  .media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card h2 {
    margin: 10px 0 0;
    font-size: 16px;
  }
</style>
</head>
<body>
  <div class="page">
    <div class="main">
      <div class="row">
        <article class="card">
          <div class="media">
            <img src="https://placehold.co/600x400/e74c3c/ffffff?text=Left" alt="Left">
          </div>
          <h2>Left card with moderate intrinsic image</h2>
        </article>
        <article class="card">
          <div class="media">
            <img src="https://placehold.co/1200x800/3498db/ffffff?text=Right" alt="Right">
          </div>
          <h2>Right card with large intrinsic image must stay inside its flex share</h2>
        </article>
      </div>
    </div>
    <aside class="side">
      <p>Sidebar content</p>
    </aside>
  </div>
</body>
</html>
