<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; }
    .grid { display: grid; grid-template-columns: 120px 1fr; grid-template-rows: auto auto; gap: 16px; max-width: 400px; }
    .left-top { background: #eee; }
    .left-bottom { background: #ddd; }
    .right { grid-row: 1 / 3; display: block; }
    .right img { width: 100%; height: 120px; background: #999; display: block; }
    .right h2 { margin: 0; font-size: 18px; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="left-top">
      <p>TOP marker.</p>
    </div>
    <div class="right">
      <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" />
      <h2>RIGHT headline must sit between the TOP and BOTTOM markers.</h2>
    </div>
    <div class="left-bottom">
      <p>BOTTOM marker.</p>
    </div>
  </div>
</body>
</html>
