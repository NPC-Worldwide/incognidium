<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --menu-icon-background: #FFE500;
  --menu-icon-background-hover: #FFD900;
  --menu-icon-foreground: #052962;
}
body { margin: 20px; font-family: sans-serif; background: #041f4a; }
.menu {
  z-index: 38;
}
.icon {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-color: var(--menu-icon-background);
}
.icon:hover {
  background-color: var(--menu-icon-background-hover);
}
.offscreen {
  position: absolute;
  overflow: hidden;
  white-space: nowrap;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  clip: rect(1px, 1px, 1px, 1px);
  clip-path: inset(50%);
}
.hide { display: none; }
</style>
</head>
<body>
<label class="menu" aria-label="Toggle main menu" tabindex="0" role="button">
  <span class="icon">
    <span class="offscreen">Show more</span>
    <svg width="26" viewBox="-3 -3 30 30" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M23 7V5H1v2zm0 6v-2H1v2zm0 6v-2H1v2z" fill="var(--menu-icon-foreground)"></path>
    </svg>
  </span>
  <span class="icon hide">
    <span class="offscreen">Hide expanded menu</span>
    <svg width="26" viewBox="-3 -3 30 30" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
      <path fill-rule="evenodd" clip-rule="evenodd" d="M12.015 14.042 20.707 22 22 20.709 14.06 12 22 3.291 20.707 2l-8.692 7.958L3.293 2.03 2 3.321 9.97 12 2 20.679l1.293 1.291z" fill="var(--menu-icon-foreground)"></path>
    </svg>
  </span>
</label>
</body>
</html>
