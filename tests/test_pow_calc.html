<!DOCTYPE html>
<html>
<head>
<style>
.box1 {
  width: calc(sin(0.5) * 100px + 50px);
  height: calc(cos(0) * 80px);
  background: red;
  margin: 10px 0;
}
.box2 {
  width: calc(pow(2, 3) * 10px);
  height: calc(pow(2, 3) * 10px);
  background: blue;
  margin: 10px 0;
}
.box3 {
  width: 80px;
  height: 80px;
  background: green;
  margin: 10px 0;
}
</style>
</head>
<body>
<div class="box1">sin/cos</div>
<div class="box2">pow</div>
<div class="box3">reference</div>
</body>
</html>
