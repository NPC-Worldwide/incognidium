<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 20px; font-family: sans-serif; }
  .container { width: 400px; background: #f0f0f0; }
  .box { float: left; width: 100%; height: 60px; color: #fff; padding: 8px; box-sizing: border-box; }
  .first { background: rgba(200, 0, 0, 0.8); }
  .second { background: rgba(0, 0, 200, 0.8); }
  .third { float: left; width: 100%; height: 60px; background: rgba(0, 128, 0, 0.8); color: #fff; padding: 8px; box-sizing: border-box; }
  .clear { clear: both; }
</style>
</head>
<body>
  <div class="container">
    <div class="box first">First full-width float</div>
    <div class="box second">Second full-width float must be below first</div>
    <div class="third">Third full-width float must be below second</div>
    <div class="clear"></div>
  </div>
</body>
</html>
