<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .box { width: 200px; height: 100px; border-radius: 20px; overflow: hidden; background: #f3f4f6; border: 2px solid #333; padding: 10px; }
    .text { font-size: 18px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="box">
    <div class="text">This text should be clipped to the rounded padding box of its parent container and not overflow the corners.</div>
  </div>
</body>
</html>
