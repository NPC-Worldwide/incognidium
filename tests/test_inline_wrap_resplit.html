<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .wrap {
      width: 240px;
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 16px;
      line-height: 1.4;
    }
    .float {
      float: left;
      width: 80px;
      height: 40px;
      background: #4a90d9;
      margin-right: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <p class="wrap">
    <span class="float"></span>
    This paragraph flows beside a short float. Other features besides the core token are generally used to describe sample presentation or behavior.
  </p>
</body>
</html>
