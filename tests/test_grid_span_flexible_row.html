<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .grid {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-rows: min-content 1fr;
      width: 400px;
      height: 300px;
      gap: 10px;
      background: #f0f0f0;
    }
    .head {
      grid-column: 2;
      grid-row: 1;
      background: #4a90d9;
      color: #fff;
      padding: 8px;
    }
    .side {
      grid-column: 1;
      grid-row: 1 / 3;
      background: #d9d9d9;
      padding: 8px;
    }
    .body {
      grid-column: 2;
      grid-row: 2;
      background: #90d94a;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="side">Sidebar</div>
    <div class="head">Header</div>
    <div class="body">Body</div>
  </div>
</body>
</html>
