<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      margin: 40px;
      font-family: sans-serif;
      background: #f5f5f5;
    }
    .square {
      position: relative;
      display: inline-block;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #4a90d9, #7e5bef);
      border-radius: 12px;
    }
    .square::after {
      content: "✓";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 36px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <span class="square"></span>
</body>
</html>
