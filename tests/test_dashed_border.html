<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .box {
      width: 80px;
      height: 50px;
      margin: 12px;
      display: inline-block;
      background: #f5f5f5;
    }
    .dashed { border: 3px dashed #d94a4a; }
    .dotted { border: 3px dotted #4a90d9; }
    .double { border: 4px double #48bb78; }
    .thick { border: 6px dashed #2d3748; }
  </style>
</head>
<body>
  <div class="box dashed"></div>
  <div class="box dotted"></div>
  <div class="box double"></div>
  <div class="box thick"></div>
</body>
</html>
