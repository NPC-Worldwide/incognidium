<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    table {
      border-collapse: separate;
      border-spacing: 0;
      background: #f0f0f0;
    }
    td {
      padding: 8px;
      border: 1px solid #ccc;
      vertical-align: middle;
    }
    .icon {
      width: 32px;
      height: 32px;
      background: #4a90d9;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <table>
    <tr>
      <td><div class="icon"></div></td>
      <td class="text">Centered text</td>
    </tr>
  </table>
</body>
</html>
