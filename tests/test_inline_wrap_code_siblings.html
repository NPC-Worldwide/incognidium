<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .wrap {
      width: 240px;
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 16px;
      line-height: 1.4;
    }
    code {
      background: #f0f0f0;
      padding: 1px 3px;
      border-radius: 2px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <p class="wrap">
    The tokens are <code>alpha</code>, <code>beta</code>, <code>gamma</code>, <code>delta</code>, <code>epsilon</code>, <code>zeta</code>, <code>eta</code>, <code>theta</code>, <code>iota</code>, <code>kappa</code>, <code>lambda</code>, and <code>mu</code>.
  </p>
</body>
</html>
