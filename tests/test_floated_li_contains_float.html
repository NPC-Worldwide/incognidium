<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { float: left; background: #ccc; }
  a { float: left; height: 40px; background: #0a8935; color: #fff; padding: 0 12px; }
  .clear { clear: both; }
</style>
</head>
<body>
  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">Forecast</a></li>
  </ul>
  <div class="clear"></div>
  <p>Below nav</p>
</body>
</html>
