<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inline SVG use sprite inside flex button without display:block</title>
  <style>
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid #000;
      background: #f5f5f5;
      padding: 0;
    }
    .icon {
      /* intentionally no display:block; matches LA Times header search icon */
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .hidden { display: none; }
    .size-4 { width: 16px; height: 16px; }
    .fill-current { fill: currentColor; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute">
    <symbol id="icon-magnify" viewBox="0 0 24 24">
      <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
    </symbol>
    <symbol id="close-x" viewBox="0 0 24 24">
      <path d="M18.3 5.7L12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4L12 10.6l6.3-6.3z"/>
    </symbol>
  </svg>
  <button class="btn" type="button">
    <svg data-element="magnify-icon" class="icon">
      <use href="#icon-magnify"></use>
    </svg>
    <span class="sr-only">Show Search</span>
    <svg data-element="close-icon" class="hidden size-4 fill-current">
      <use href="#close-x"></use>
    </svg>
  </button>
</body>
</html>
