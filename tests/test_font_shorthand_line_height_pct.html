<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; }
  .box { width: 200px; background: #eee; margin-bottom: 10px; }
  .standalone { font-size: 20px; line-height: 200%; }
  .standalone .child { font-size: 10px; background: #aaf; }
  .shorthand { font: 20px/200% sans-serif; }
  .shorthand .child { font-size: 10px; background: #faa; }
</style>
</head>
<body>
  <div class="box standalone">
    standalone parent
    <span class="child">child</span>
  </div>
  <div class="box shorthand">
    shorthand parent
    <span class="child">child</span>
  </div>
</body>
</html>
