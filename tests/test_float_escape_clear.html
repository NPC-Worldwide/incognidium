<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; width: 400px; }
  .top { height: 50px; background: #333; }
  .container { width: 100%; background: #ddd; }
  .float { float: left; width: 50%; height: 100px; }
  .a { background: #e74c3c; }
  .b { background: #3498db; }
  .clear { clear: both; height: 0; }
  .footer { width: 100%; height: 40px; background: #27ae60; }
</style>
</head>
<body>
  <div class="top">Top</div>
  <div class="container">
    <div class="float a">A</div>
    <div class="float b">B</div>
  </div>
  <div class="clear"></div>
  <div class="footer">Footer</div>
</body>
</html>
