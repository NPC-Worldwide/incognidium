<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    a { display: block; border: 2px solid #333; padding: 10px; text-decoration: none; color: #000; }
    h2 { margin: 0; font-size: 20px; }
    p { margin: 10px 0 0; }
  </style>
</head>
<body>
  <a href="#">
    <h2>Block headline inside inline link</h2>
    <p>This paragraph must sit below the headline.</p>
  </a>
</body>
</html>
