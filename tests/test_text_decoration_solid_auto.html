<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text decoration skip-ink auto</title>
<style>
body { margin: 40px; font-family: system-ui, sans-serif; }
.line {
  font-size: 24px;
  margin: 20px 0;
}
.thin { text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: #e74c3c; }
.thick { text-decoration: underline; text-decoration-thickness: 4px; text-decoration-color: #3498db; }
.double { text-decoration: underline; text-decoration-style: double; text-decoration-thickness: 2px; text-decoration-color: #27ae60; }
</style>
</head>
<body>
<p class="line thin">Thin red underline</p>
<p class="line thick">Thick blue underline</p>
<p class="line double">Double solid underline</p>
</body>
</html>
