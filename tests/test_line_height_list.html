<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; font-size: 16px; margin: 0; padding: 10px; }
    ul {
      line-height: 26px;
      padding-left: 40px;
      list-style-position: outside;
      margin: 0;
    }
    li {
      display: block;
      padding-top: 5px;
      padding-bottom: 5px;
    }
  </style>
</head>
<body>
  <ul>
    <li>First item with enough text to wrap</li>
    <li>Second item also has text that may wrap</li>
    <li>Third item is shorter.</li>
  </ul>
</body>
</html>
