<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .panel { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 120px; height: 120px; background: #1f2937; color: #fff; border-radius: 8px; }
    .panel::before { content: "▲"; color: #60a5fa; font-size: 24px; margin-bottom: 8px; }
    .number { font-size: 32px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="panel">
    <span class="number">42</span>
  </div>
</body>
</html>
