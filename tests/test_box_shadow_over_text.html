<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Outset Box-Shadow vs Text Paint Order</title>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #f0f0f0;
    font-family: sans-serif;
  }
  .card {
    position: relative;
    width: 300px;
    padding: 20px;
    margin: 40px auto;
    background: #ffffff;
    border-radius: 8px;
    /* Outset shadow cast upward, above the card */
    box-shadow: 0 -30px 0 10px rgba(255, 0, 0, 0.8);
  }
  .headline {
    margin: 0;
    font-size: 24px;
    font-weight: bold;
    color: #000000;
    text-align: center;
    /* Pull headline upward so it overlaps the shadow region */
    transform: translateY(-55px);
  }
  .note {
    text-align: center;
    color: #555;
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="headline">Does the card shadow paint over the text?</p>
  </div>
  <p class="note">The red outset shadow is cast above the card. Correct paint order keeps it behind the card and its text.</p>
</body>
</html>
