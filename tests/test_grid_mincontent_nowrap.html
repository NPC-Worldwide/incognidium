<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; font-family: system-ui, sans-serif; }
.grid {
  display: grid;
  grid-template-columns: 1fr min-content;
  gap: 10px;
  padding: 10px;
}
.main {
  background: #d1fae5;
  padding: 10px;
}
.side {
  background: #dbeafe;
  padding: 10px;
  white-space: nowrap;
}
</style>
</head>
<body>
<div class="grid">
  <div class="main">
    <p>Main content area keeps most of the width.</p>
  </div>
  <div class="side">
    <p>Side text that does not wrap.</p>
  </div>
</div>
</body>
</html>
