<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 40px; font-family: sans-serif; }
    .bar {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #ccc;
      padding: 4px;
    }
    input {
      width: 120px;
      font-size: 14px;
    }
    button {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: fit-content;
      padding: 4px 12px;
      font-size: 14px;
      border: 1px solid #888;
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <div class="bar">
    <input type="text" value="">
    <button>Search</button>
  </div>
</body>
</html>
