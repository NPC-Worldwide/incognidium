<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .grid {
      display: grid;
      grid-template-rows: 1fr 1fr;
      align-content: space-between;
      width: 400px;
      height: 400px;
      background: #f0f0f0;
      padding: 10px;
      box-sizing: border-box;
    }
    .top, .bottom {
      background: #4a90d9;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="top">Top box</div>
    <div class="bottom">Bottom box</div>
  </div>
</body>
</html>
