<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Attribute selector layout</title>
  <style>
    .card[data-top-center] .wrapper {
      display: flex;
      flex-direction: column;
    }
    .card[data-top-center] .media { order: -1; }
    .media { width: 100%; height: 60px; background: #ccc; }
    .text { padding: 5px; }
  </style>
</head>
<body>
  <div class="card" data-top-center>
    <div class="wrapper">
      <div class="text">Headline text should sit below the gray box.</div>
      <div class="media"></div>
    </div>
  </div>
</body>
</html>
