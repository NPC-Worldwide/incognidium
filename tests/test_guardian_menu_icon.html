<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --masthead-veggie-burger-background: #FFE500;
  --masthead-veggie-burger-icon: #052962;
}
body { margin: 20px; font-family: sans-serif; }
.icon {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-color: var(--masthead-veggie-burger-background);
}
.offscreen {
  position: absolute;
  overflow: hidden;
  white-space: nowrap;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  border: 0;
  clip: rect(1px, 1px, 1px, 1px);
  clip-path: inset(50%);
}
</style>
</head>
<body>
<div class="icon">
  <span class="offscreen">Open main menu</span>
  <svg width="26" viewBox="-3 -3 30 30" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M23 7V5H1v2zm0 6v-2H1v2zm0 6v-2H1v2z" fill="var(--masthead-veggie-burger-icon)"></path>
  </svg>
</div>
</body>
</html>
