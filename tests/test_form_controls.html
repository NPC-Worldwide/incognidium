<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form controls</title>
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .row { margin: 10px 0; }
  </style>
</head>
<body>
  <div class="row"><button>Submit</button></div>
  <div class="row"><input type="text" value="Text input"></div>
  <div class="row"><input type="password" value="secret"></div>
  <div class="row"><input type="search" value="search"></div>
  <div class="row"><textarea rows="2" cols="20">Text area</textarea></div>
  <div class="row"><select><option>Option 1</option><option>Option 2</option></select></div>
</body>
</html>
