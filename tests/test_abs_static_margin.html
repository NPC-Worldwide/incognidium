<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
}
.container {
  padding: 50px;
  background: #f0f0f0;
  position: relative;
}
.box {
  width: 100px;
  height: 100px;
  background: red;
}
.abs {
  position: absolute;
  top: auto;
  left: auto;
  margin-top: 40px;
  margin-left: 20px;
  width: 100px;
  height: 100px;
  background: blue;
}
</style>
</head>
<body>
<div class="container">
  <div class="box"></div>
  <div class="abs"></div>
</div>
</body>
</html>
