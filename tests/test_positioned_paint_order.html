<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .container { position: relative; width: 300px; height: 150px; background: #e5e7eb; }
    .red { position: absolute; right: 0; top: 0; width: 120px; height: 150px; background: #ef4444; }
    .green { position: relative; left: 80px; top: 50px; width: 140px; height: 60px; background: #22c55e; color: #fff; font-size: 24px; font-weight: bold; padding: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="red"></div>
    <div class="green">Visible</div>
  </div>
</body>
</html>
