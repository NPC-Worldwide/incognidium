<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Text Emphasis Test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            font-size: 24px;
        }
        .emphasis {
            text-emphasis: filled red;
            text-emphasis-position: over;
        }
        .open {
            text-emphasis: open blue;
        }
        .dot {
            text-emphasis: dot green;
        }
        .triangle {
            text-emphasis: triangle purple;
        }
        .sesame {
            text-emphasis: sesame orange;
        }
        p {
            margin: 24px 0;
        }
    </style>
</head>
<body>
    <p class="emphasis">Filled red emphasis</p>
    <p class="open">Open blue emphasis</p>
    <p class="dot">Dot green emphasis</p>
    <p class="triangle">Triangle purple emphasis</p>
    <p class="sesame">Sesame orange emphasis</p>
</body>
</html>
