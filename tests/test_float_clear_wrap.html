<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .container {
      width: 700px;
      border: 1px solid #ccc;
      padding: 10px;
    }
    .float {
      float: right;
      width: 160px;
      background: #d9d9d9;
      padding: 8px;
      margin-left: 10px;
      margin-bottom: 10px;
    }
    .clear { clear: right; }
    .text { font-size: 16px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Heading</h2>
    <div class="float">First right float</div>
    <div class="float clear">Second right float with clear:right</div>
    <p class="text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>
  </div>
</body>
</html>
