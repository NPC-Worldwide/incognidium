<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 20px; font-family: sans-serif; }
ul { list-style: none; padding: 0; display: flex; }
.item {
  position: relative;
  margin-right: 20px;
}
.item:not(:last-child):after {
  content: "/";
  color: #999;
  pointer-events: none;
  font-size: 110%;
  line-height: 26px;
  position: absolute;
  bottom: 9px;
  right: -14px;
}
</style>
</head>
<body>
<ul>
  <li class="item"><a href="#">Tech</a></li>
  <li class="item"><a href="#">Reviews</a></li>
  <li class="item"><a href="#">Science</a></li>
</ul>
</body>
</html>
