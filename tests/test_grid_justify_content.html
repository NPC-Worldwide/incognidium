<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; }
  .grid { display: grid; width: 800px; grid-template-columns: 200px 100px; justify-content: center; background: #eee; }
  .item { background: #4a90d9; height: 50px; }
  .a { background: #e74c3c; }
  .b { background: #27ae60; }
</style>
</head>
<body>
  <div class="grid">
    <div class="item a">A</div>
    <div class="item b">B</div>
  </div>
</body>
</html>
