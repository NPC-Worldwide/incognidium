<html>

  <style>
    body { margin: 20px; font-family: sans-serif; }
    .container { width: 700px; }
    table {
      float: right;
      width: 240px;
      border-collapse: collapse;
      background: #f5f5f5;
      margin-left: 16px;
      margin-bottom: 16px;
    }
    th, td {
      border: 1px solid #999;
      padding: 6px 10px;
      text-align: left;
    }
    th { background: #e2e2e2; }
    p { line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <table>
      <tr><th colspan="2">Language</th></tr>
      <tr><td>Paradigms</td><td>Multi-paradigm</td></tr>
      <tr><td>Developer</td><td>The Rust Team</td></tr>

    </table>

  </div>

</html>
