<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: 'iconfont';
      src: url('data:application/font-woff2;base64,') format('woff2'),
           url('data:font/truetype;base64,') format('truetype'),
           url('data:image/svg+xml;base64,') format('svg');
    }
    body { margin: 20px; font-family: sans-serif; }
    .icon { font-family: 'iconfont'; font-size: 48px; }
  </style>
</head>
<body>
  <p>Icon font test</p>
  <span class="icon">&#xe900;</span>
</body>
</html>
