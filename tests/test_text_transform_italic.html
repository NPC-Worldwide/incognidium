<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text transform with italic</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; padding: 16px; }
  .dateline {
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
  }
</style>
</head>
<body>
  <p class="dateline">Friday, November 6, 2026</p>
</body>
</html>
