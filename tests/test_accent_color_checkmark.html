<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: system-ui, sans-serif;
    padding: 40px;
    background: #f5f7fa;
  }
  .demo {
    background: white;
    padding: 30px;
    border-radius: 12px;
    display: inline-block;
  }
  label {
    display: block;
    font-size: 18px;
    margin-bottom: 12px;
  }
  input[type="checkbox"] {
    accent-color: #e67e22;
    width: 20px;
    height: 20px;
    margin-right: 8px;
    vertical-align: middle;
  }
</style>
</head>
<body>
  <div class="demo">
    <label><input type="checkbox" checked> Orange accent checked</label>
    <label><input type="checkbox"> Orange accent unchecked</label>
  </div>
</body>
</html>
