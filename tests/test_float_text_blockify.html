<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .container {
      width: 320px;
      border: 1px solid #ccc;
      padding: 8px;
    }
    .float {
      float: left;
      width: 60px;
      height: 60px;
      background: #4a90d9;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    .badge {
      display: inline-block;
      background: #d94a90;
      color: #fff;
      padding: 2px 6px;
      margin-right: 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="float"></div>
    <span class="badge">inline badge element</span>
    followed by normal text that should wrap beside the float, not one word per line.
  </div>
</body>
</html>
