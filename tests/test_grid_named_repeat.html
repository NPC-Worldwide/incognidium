<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; font-family: sans-serif; }
    .grid {
      display: grid;
      grid-template-columns: [start] 0 [content-start] repeat(4, [main-start] minmax(0, 1fr) [main-end]) [content-end] 0 [end];
      gap: 10px;
      padding: 16px;
      background: #f0f0f0;
    }
    .logo { grid-column: content-start / main-start 2; background: #87ceeb; padding: 12px; }
    .nav { grid-column: main-start 3 / content-end; background: #90ee90; padding: 12px; }
    .full { grid-column: start / end; background: #ffb6c1; padding: 12px; }
  </style>
</head>
<body>
  <div class="grid">
    <div class="logo">Logo span 1-2</div>
    <div class="nav">Navigation span 3-4</div>
    <div class="full">Full viewport span</div>
  </div>
</body>
</html>
