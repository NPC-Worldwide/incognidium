<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Default unordered list markers</title>
<style>
  body { margin: 20px; font-family: sans-serif; }
</style>
</head>
<body>
  <p>Default list outside nav:</p>
  <ul>
    <li>Apple</li>
    <li>Banana</li>
    <li>Cherry</li>
  </ul>

  <p>Default list inside nav:</p>
  <nav>
    <ul>
      <li>News</li>
      <li>Culture</li>
      <li>Music</li>
    </ul>
  </nav>

  <p>Nested list:</p>
  <ul>
    <li>One</li>
    <li>Two
      <ul>
        <li>Two-A</li>
        <li>Two-B</li>
      </ul>
    </li>
  </ul>
</body>
</html>
