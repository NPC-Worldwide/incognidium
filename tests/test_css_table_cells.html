<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 20px; font-family: sans-serif; }
    .row {
      display: table;
      width: 500px;
      margin-bottom: 10px;
    }
    .score, .story {
      display: table-cell;
      padding: 8px;
    }
    .score {
      width: 60px;
      text-align: center;
      background: #f0f0f0;
    }
    .triangle { color: #d94a4a; font-size: 20px; }
    .tag {
      display: inline-block;
      background: #f6e05e;
      padding: 2px 6px;
      border-radius: 3px;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="score">
      <div class="triangle">▲</div>
      <div>70</div>
    </div>
    <div class="story">
      <h3>First story headline</h3>
      <span class="tag">Tag A</span>
      <span class="tag">Tag B</span>
      <div class="meta">example.com · 2 hours ago</div>
    </div>
  </div>
  <div class="row">
    <div class="score">
      <div class="triangle">▲</div>
      <div>42</div>
    </div>
    <div class="story">
      <h3>Second story headline</h3>
      <span class="tag">Tag C</span>
      <div class="meta">domain.test · 5 hours ago</div>
    </div>
  </div>
</body>
</html>
