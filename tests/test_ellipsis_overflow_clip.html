<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; }
  .row { width: 400px; border: 1px solid #333; overflow: hidden; white-space: nowrap; }
  .label { display: inline-block; width: 100px; background: #c0392b; color: #fff; }
  .ellipsis { display: inline-block; width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #2980b9; color: #fff; }
  .after { display: inline-block; width: 100px; height: 40px; background: #27ae60; color: #fff; }
</style>
</head>
<body>
  <div class="row">
    <span class="label">Label</span>
    <span class="ellipsis">This long text must be clipped and not overlap the green box</span>
    <span class="after">After</span>
  </div>
</body>
</html>
