<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; margin: 0; padding: 20px; }
    .card { width: 200px; background: #eee; }
    img { display: block; width: 200px; height: 100px; }

  </div>

</html>
