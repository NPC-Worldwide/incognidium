<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inline SVG block icon sizing</title>
  <style>
    html { color-scheme: light dark; background: light-dark(#eee, #222); }
    body {
      font: 16px/1.6 system-ui, sans-serif;
      max-width: 26em;
      margin: auto;
      padding: 10vh 2em 2em;
      text-align: center;
    }
    svg { display: block; margin: 0 auto; opacity: 0.55; }
    p + p { font-size: 0.875em; opacity: 0.6; }
  </style>
</head>
<body>
  <svg viewBox="0,0,20,20" width="44" height="44" fill="currentColor" aria-hidden="true">
    <path fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"
          d="M6 4H3v12q4 0 7 1.5-1-3.5-4-4.5V2q3.5 1 4 3v12.5q3-1.5 7-1.5V4q-4.5 0-7 1"/>
  </svg>
  <p>This page demonstrates a block-level inline SVG icon with explicit width and height.</p>
  <p lang="ar" dir="rtl">هذا النص عربي.</p>
  <p lang="es">Este texto está en español.</p>

</html>
